NODE_ENV: production
DB_SSL: "true"

# PostgreSQL connection used by the API.
# Fill these with the same production database values currently used by Render.
DB_HOST: your-postgres-host
DB_PORT: "5432"
DB_USERNAME: your-postgres-user
DB_PASSWORD: your-postgres-password
DB_NAME: your-postgres-database

# Required for JWT tokens. Use one long random value and keep it stable.
JWT_SECRET: replace-with-a-long-random-secret

# Optional but recommended if you use Redis-backed queues.
REDIS_HOST: ""
REDIS_PORT: ""
REDIS_PASSWORD: ""

# AI / payments / auth integrations.
OPENROUTER_API_KEY: ""
STRIPE_SECRET_KEY: ""
STRIPE_WEBHOOK_SECRET: ""
STRIPE_PUBLISHABLE_KEY: ""
STRIPE_PREMIUM_MONTHLY_PRICE_ID: ""
STRIPE_PREMIUM_YEARLY_PRICE_ID: ""
GOOGLE_CLIENT_ID: ""
GOOGLE_CLIENT_ID_WEB: ""
GOOGLE_CLIENT_ID_IOS: ""
GOOGLE_CLIENT_ID_ANDROID: ""
GOOGLE_CLIENT_SECRET: ""
GOOGLE_CALLBACK_URL: ""
FRONTEND_URL: ""

